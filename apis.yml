aid: riskrecon
name: RiskRecon
description: >-
  RiskRecon by Mastercard is a third-party and supply-chain cyber risk management platform
  that continuously assesses, rates, and monitors the cybersecurity posture of an organization
  and its vendor ecosystem. It produces objective, automated security ratings across dozens of
  security criteria, prioritizes findings by asset value and issue severity, and lets teams tune
  assessments to their own risk appetite. RiskRecon exposes a REST API (api.riskrecon.com) so
  customers can programmatically pull portfolio ratings, toe (target-of-evaluation) analyses,
  findings, and evidence into their own GRC, TPRM, and security workflows. Originally venture
  backed by Accel and others, RiskRecon was acquired by Mastercard and now operates as RiskRecon
  by Mastercard.
